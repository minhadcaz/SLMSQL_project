[project]
name = "slm-sql-research"
version = "0.1.0"
description = "Author SLM-SQL baseline and CSC LoRA adaptation with paired evaluation"
requires-python = ">=3.10"

[project.scripts]
slm-sql-csc = "research.slm_sql.__main__:main"
eval-bird = "benchmarks.eval_ex:main"
data-prep = "training.data_prep:main"
gen-candidates = "research.candidate_generator:main"
run-simulator = "research.simulator:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
