[project]
name = "slm-sql-research"
version = "0.1.0"
description = "LoRA SLM Text-to-SQL + Adaptive Sampling Research"
requires-python = ">=3.10"

[project.scripts]
eval-bird = "benchmarks.eval_ex:main"
data-prep = "training.data_prep:main"
gen-candidates = "research.candidate_generator:main"
run-simulator = "research.simulator:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
