# LoRA hyperparameter grid — Task 3.1
# Tối đa 6 cấu hình để vừa ngân sách GPU

grid:
  ranks: [16, 64]
  target_modules:
    attn_only: [q_proj, k_proj, v_proj, o_proj]
    all_linear: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  learning_rates: [1.0e-4, 2.0e-4]
  rslora: [true, false]

fixed:
  max_seq_len: 2048
  gradient_checkpointing: true
  dtype: float16  # T4/P100 không hỗ trợ bf16
  lora_alpha_ratio: 2  # alpha = rank * ratio
  lora_dropout: 0.0
  warmup_ratio: 0.03
  weight_decay: 0.01
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8  # effective batch = 16
  save_steps: 500
  logging_steps: 10
  seed: 42

pilot:
  train_samples: 5000
  eval_samples: 300
  eval_split: "bird_dev_subset"

full_training:
  train_sizes: [10000, 30000, 50000]
  selected_size: null  # cập nhật sau task 3.2

models:
  small: Qwen/Qwen2.5-Coder-0.5B-Instruct
  medium: Qwen/Qwen2.5-Coder-1.5B-Instruct

quantization:
  small: none  # 0.5B vừa T4 16GB ở fp16
  medium: 4bit  # 1.5B có thể cần QLoRA nếu tràn VRAM
